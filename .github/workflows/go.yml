name: Verify architecture kit

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            examples/go/go.sum
            enforcement/go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify documentation, Go checks, and installation
        run: python3 scripts/verify.py --local
